<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Books</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Loading -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="book-spinner">
                <div class="book-page"></div>
                <div class="book-page"></div>
                <div class="book-page"></div>
            </div>
            <p id="loading-text">Opening a random book...</p>
        </div>
    </div>

    <!-- Error -->
    <div id="error-screen" class="hidden">
        <div class="error-content">
            <p class="error-icon">📖</p>
            <h2>Could not load book</h2>
            <p id="error-msg"></p>
            <button id="retry-btn">Try again</button>
        </div>
    </div>

    <!-- Reader -->
    <div id="reader" class="hidden">
        <header id="topbar">
            <div class="topbar-left">
                <button id="toc-toggle" aria-label="Table of Contents">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect y="3" width="20" height="2" rx="1" fill="currentColor"/><rect y="9" width="14" height="2" rx="1" fill="currentColor"/><rect y="15" width="18" height="2" rx="1" fill="currentColor"/></svg>
                </button>
                <span id="topbar-title"></span>
            </div>
            <div class="topbar-right">
                <button id="font-size-down" aria-label="Decrease font size">A-</button>
                <button id="font-size-up" aria-label="Increase font size">A+</button>
                <button id="theme-toggle" aria-label="Toggle theme">◐</button>
                <button id="random-btn" aria-label="New random book">⟳</button>
            </div>
        </header>

        <!-- TOC Sidebar -->
        <aside id="toc-sidebar">
            <div class="toc-header">
                <h2>Table of Contents</h2>
                <button id="toc-close" aria-label="Close table of contents">✕</button>
            </div>
            <ul id="toc-list"></ul>
        </aside>
        <div id="toc-overlay" class="hidden"></div>

        <!-- Book Content -->
        <main id="book-scroll">
            <article id="book-content">
                <div id="title-page">
                    <div class="title-ornament">❦</div>
                    <h1 id="book-title"></h1>
                    <p class="author-prefix">by</p>
                    <p id="book-author"></p>
                    <div class="title-ornament">❦</div>
                </div>
                <div id="chapter-text"></div>
            </article>
        </main>

        <!-- Bottom Nav -->
        <nav id="bottom-nav">
            <button id="prev-chapter" disabled>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Previous
            </button>
            <span id="chapter-indicator"></span>
            <button id="next-chapter">
                Next
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3L11 8L6 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </nav>

        <!-- Progress bar -->
        <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
